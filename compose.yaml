name: spoolmera
services:
  spoolmera:
    # Local builds remain the default; set SPOOLMERA_IMAGE for a published GHCR image.
    image: ${SPOOLMERA_IMAGE:-spoolmera:local}
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    env_file:
      - path: .env
        required: false
    environment:
      SPOOLMERA_DB_PATH: /data/spoolmera.sqlite3
    volumes:
      - spoolmera_data:/data
    # Preserve availability under abusive requests; tune for small self-hosted hosts.
    mem_limit: 768m
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  spoolmera_data:
