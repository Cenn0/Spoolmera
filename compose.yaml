# Retain default Compose project name to keep the existing filament_data Docker volume
# across a source-folder rename; -p continues to override this setting.
name: filamentmanager
services:
  spoolmera:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    env_file:
      - path: .env
        required: false
    environment:
      FILAMENT_DB_PATH: /data/filaments.sqlite3
    volumes:
      - filament_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  filament_data:
