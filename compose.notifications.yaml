# Optional. Start with:
# docker compose -f compose.yaml -f compose.notifications.yaml up -d --build
services:
  spoolmera-notifications:
    build:
      context: .
      dockerfile: Dockerfile.notifications
    restart: unless-stopped
    depends_on:
      spoolmera:
        condition: service_healthy
    environment:
      SPOOLMERA_URL: http://spoolmera:8765
      SPOOLMERA_AUTOMATION_TOKEN: ${SPOOLMERA_AUTOMATION_TOKEN:?Create an events_read automation token}
      SPOOLMERA_NTFY_URL: ${SPOOLMERA_NTFY_URL:?Set the private notification endpoint}
      SPOOLMERA_NTFY_TOKEN: ${SPOOLMERA_NTFY_TOKEN:-}
      SPOOLMERA_NOTIFICATION_CATEGORIES: ${SPOOLMERA_NOTIFICATION_CATEGORIES:-low_stock,job_review,printer_offline}
    volumes:
      - spoolmera_notifier_state:/state
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 32
    cpus: 0.5
volumes:
  spoolmera_notifier_state:
