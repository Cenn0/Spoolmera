version: 2
updates:
  # Keep GitHub-hosted workflow actions current and review their changelogs.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    # CodeQL init/analyze must use the exact same release within a workflow.
    # Group them to prevent version-mismatch failures in separate PRs.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
  # Python uses uv-compiled, SHA256-hashed requirements (not uv.lock).
  # Dependabot pip updates are proposals: CI checks pin/hash consistency.
  # Recompile all three lockfiles with uv and review before merging.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    versioning-strategy: increase
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    # Angular 22's compiler/build toolchain supports TypeScript 6.0.x, not 7.x.
    # Revisit this restriction when upgrading Angular to a compatible release.
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      angular:
        patterns:
          - "@angular/*"
      frontend-tooling:
        dependency-type: development
        exclude-patterns:
          - "@angular/*"
