name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 2'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          output: codeql-results
          post-processed-sarif-path: codeql-results-processed
# PR-local, temporary diagnostic: print only CodeQL rule IDs and source
      # locations, never taint traces, source snippets or exploit details.
      - name: Summarize analysis locations for triage
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 30
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import json
          import os
          paths = glob.glob(os.path.join(os.environ['GITHUB_WORKSPACE'], 'codeql-results', '*.sarif'))
          paths += glob.glob(os.path.join(os.environ['GITHUB_WORKSPACE'], 'codeql-results-processed', '*.sarif'))
          print(f'CODEQL TRIAGE: {len(paths)} saved SARIF files')
          for path in paths:
              try:
                  document = json.load(open(path, encoding='utf-8'))
              except (OSError, ValueError):
                  continue
              for run in document.get('runs', []):
                  rules = {rule.get('id'): rule for rule in run.get('tool', {}).get('driver', {}).get('rules', [])}
                  print(f'CODEQL TRIAGE: {len(run.get("results", []))} results in file')
                  for result in run.get('results', [])[:80]:
                      rule_id = result.get('ruleId', 'unknown')
                      rule = rules.get(rule_id, {})
                      severity = rule.get('properties', {}).get('security-severity', '')
                      locations = result.get('locations', [])
                      physical = (locations[0].get('physicalLocation', {}) if locations else {})
                      uri = physical.get('artifactLocation', {}).get('uri', '?')
                      line = physical.get('region', {}).get('startLine', '?')
                      print(f'CODEQL TRIAGE: {rule_id} in {uri}:{line}; CVSS={severity}')
          PY
