name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Validate Python source pins and hashed lockfiles
        run: python scripts/check_python_locks.py
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Compile backend
        run: python -m compileall -q app
      - name: Validate documentation links and UI screenshot files
        run: python scripts/check_docs.py
      - name: Reject accidental personal email addresses in tracked files
        run: python scripts/check_public_content.py
      - name: Validate generated Angular API contracts
        run: python scripts/generate_api_types.py --check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate Angular frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          node scripts/collect-license-notices.mjs
          npm run typecheck
          npm run i18n:check
          npm test
          npm run build
      - name: Stage compiled frontend for backend tests
        run: mkdir -p app/ui && cp -a frontend/dist/spoolmera/browser/. app/ui/
      - name: Run API tests
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Summarize API test results (no artifact storage)
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path('test-results.xml')
          if report.is_file():
              root = ET.parse(report).getroot()
              suite = root if root.tag == "testsuite" else root.find("testsuite")
              if suite is not None:
                  fields = ("tests", "failures", "errors", "skipped")
                  summary = " | ".join(f"{field}: {suite.get(field, '0')}" for field in fields)
                  print(summary)
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
                      output.write("### API tests\n\n" + summary + "\n")
          else:
              print("No XML test report (earlier step may have failed).")
          PY

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build image
        run: docker build --tag spoolmera:ci --tag spoolmera:test .
      - name: Verify license notices in shipped image
        run: |
          docker run --rm --entrypoint /bin/sh spoolmera:ci -ec '
            test -s /usr/share/doc/spoolmera/LICENSE
            test -s /usr/share/doc/spoolmera/THIRD_PARTY_LICENSES.md
            test -s /usr/share/doc/spoolmera/npm-licenses.txt
            test -s /usr/share/doc/spoolmera/python-licenses.txt
            test -s /usr/share/doc/spoolmera/python-dependencies.json
          '
      - name: Start container and probe HTTP
        shell: bash
        run: |
          set -euo pipefail
          export SPOOLMERA_BOOTSTRAP_TOKEN="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          docker volume create spoolmera-ci >/dev/null
          container="$(docker run --detach --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid --env SPOOLMERA_BOOTSTRAP_TOKEN --mount type=volume,source=spoolmera-ci,target=/data --publish 127.0.0.1:8765:8765 spoolmera:ci)"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true; docker volume rm spoolmera-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/api/health | grep -q '"status":"ok"'; then
              python3 scripts/http_smoke.py
              docker restart "$container" >/dev/null
              for restart_attempt in $(seq 1 30); do
                if curl --fail --silent http://127.0.0.1:8765/api/health >/dev/null; then
                  python3 scripts/http_smoke.py --persistence
                  exit 0
                fi
                sleep 1
              done
              docker logs "$container"
              exit 1
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$container")" != "true" ]; then
              docker logs "$container"
              exit 1
            fi
            sleep 1
          done
          docker logs "$container"
          exit 1
      - name: Validate isolated test launcher
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker compose -p spoolmera-test -f compose.test.yaml down -v >/dev/null 2>&1 || true' EXIT
          python3 scripts/start_test.py --prebuilt
          export SPOOLMERA_BOOTSTRAP_TOKEN="$(python3 -c 'from pathlib import Path; print(Path(".env.test").read_text().strip().split("=", 1)[1])')"
          python3 scripts/http_smoke.py --base http://127.0.0.1:8766
      - name: Verify offline restore and runtime file ownership
        run: python3 scripts/container_restore_smoke.py --image spoolmera:ci
      - name: Build and verify optional notifier isolation
        run: |
          docker build -f Dockerfile.notifications --tag spoolmera:notifier-ci .
          python3 scripts/notifier_container_smoke.py --image spoolmera:notifier-ci --api-image spoolmera:ci

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build Angular for browser tests
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - name: Stage Angular application
        run: mkdir -p app/ui && cp -a frontend/dist/spoolmera/browser/. app/ui/
      - name: Install application and browser test dependencies
        run: python -m pip install --require-hashes -r requirements-e2e.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Exercise real browser workflows
        shell: bash
        run: |
          set -euo pipefail
          export SPOOLMERA_DB_PATH="$RUNNER_TEMP/browser-inventory.sqlite3"
          export SPOOLMERA_BOOTSTRAP_TOKEN="test-only-bootstrap-token-long-enough"
          export SPOOLMERA_PRINTER_ALLOWED_IPS="192.168.50.20"
          export SPOOLMERA_CLOUD_HMAC_BROWSER="test-only-browser-relay-secret-long-enough"
          export SPOOLMERA_CLOUD_PRINTER_BROWSER="1"
          export SPOOLMERA_BROWSER_ARTIFACT_DIR="$RUNNER_TEMP/browser-results"
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8765 >"$RUNNER_TEMP/browser-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" >/dev/null 2>&1 || true; cat "$RUNNER_TEMP/browser-server.log"' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          python scripts/browser_smoke.py
      - name: Capture every interface view in all four layouts
        run: python scripts/ui_visual_audit.py --serve --strict --output "${{ runner.temp }}/ui-all-views-audit"
      - name: Verify captured audit and previews without uploading
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/ui-all-views-audit/manifest.json"
          test -s "$RUNNER_TEMP/ui-all-views-audit/index.html"
          test -n "$(find "$RUNNER_TEMP/browser-results" -maxdepth 1 -name 'de-*.png' -print -quit)"
          test -n "$(find "$RUNNER_TEMP/browser-results" -maxdepth 1 -name 'ui-*.png' -print -quit)"
          echo "### Browser visual audit" >> "$GITHUB_STEP_SUMMARY"
          echo "Strict screenshot, layout and browser gates passed; evidence was checked locally and not uploaded." >> "$GITHUB_STEP_SUMMARY"

  slicer-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPOOLMERA_SLICER_WORKER_TOKEN: test-only-ci-slicer-worker-token-long-enough
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate optional slicer Compose overlay
        run: docker compose -f compose.yaml -f compose.slicer.yaml config --quiet
      - name: Build opt-in slicer image from distribution packages
        run: docker build --target slicer-runtime --tag spoolmera:slicer-ci .
      - name: Check installed PrusaSlicer CLI
        run: |
          docker run --rm --entrypoint /usr/bin/test spoolmera:slicer-ci -x /usr/bin/prusa-slicer
          docker run --rm --entrypoint /usr/bin/prusa-slicer spoolmera:slicer-ci --help >/dev/null
          docker run --rm --entrypoint /usr/bin/test spoolmera:slicer-ci -s /usr/share/doc/prusa-slicer/copyright
      - name: Smoke-test isolated slicer Compose networking and token
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p slicer-profiles
          cp tests/fixtures/slicer/ci.ini slicer-profiles/ci.ini
          export SPOOLMERA_BOOTSTRAP_TOKEN="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          printf 'SPOOLMERA_BOOTSTRAP_TOKEN=%s\nSPOOLMERA_SLICER_WORKER_TOKEN=%s\n' "$SPOOLMERA_BOOTSTRAP_TOKEN" "$SPOOLMERA_SLICER_WORKER_TOKEN" > .env
          trap 'docker compose -f compose.yaml -f compose.slicer.yaml down -v >/dev/null 2>&1 || true; rm -f .env; rm -rf slicer-profiles' EXIT
          docker compose -f compose.yaml -f compose.slicer.yaml up -d --build --wait
          docker compose -f compose.yaml -f compose.slicer.yaml exec -T spoolmera python -c 'import json,os,urllib.request; req=urllib.request.Request("http://slicer-worker:8767/profiles",headers={"X-Worker-Token":os.environ["SPOOLMERA_SLICER_WORKER_TOKEN"]}); assert json.load(urllib.request.urlopen(req,timeout=5))=={"profiles":["ci"]}'
          docker compose -f compose.yaml -f compose.slicer.yaml exec -T slicer-worker python -c 'import os; assert "SPOOLMERA_BOOTSTRAP_TOKEN" not in os.environ; assert not any(k.startswith("SPOOLMERA_PRINTER_TOKEN_") for k in os.environ)'
          python3 scripts/slicer_smoke.py

  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Audit locked Python runtime and development dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt
          # Keep dev-only tooling in the PR security gate, not just the nightly run.
          python -m pip_audit -r requirements-dev.txt --disable-pip --no-deps
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Audit Angular runtime and development dependencies
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm audit --include=dev --audit-level=high
      - name: Produce production frontend CycloneDX SBOM
        working-directory: frontend
        run: npm sbom --omit=dev --sbom-format cyclonedx > "$RUNNER_TEMP/frontend-sbom.cdx.json"
      - name: Verify generated SBOM without uploading
        if: success()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          source = Path(os.environ["RUNNER_TEMP"]) / "frontend-sbom.cdx.json"
          data = source.read_bytes()
          sbom = json.loads(data)
          if sbom.get("bomFormat") != "CycloneDX" or not sbom.get("components"):
              raise SystemExit("Missing or invalid CycloneDX component inventory")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as result:
              result.write(f"### Frontend SBOM\n\nCycloneDX components: {len(sbom['components'])}; SHA-256: `{hashlib.sha256(data).hexdigest()}` (generated in-job, not uploaded).\n")
          PY

  arm64-container:
    # Native architecture validation: no QEMU, registry push or release artifact.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Linux arm64 application image
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          docker build --platform linux/arm64 --target app-runtime --tag spoolmera:arm64-ci .
          test "$(docker image inspect --format '{{.Architecture}}' spoolmera:arm64-ci)" = arm64
          docker run --rm --entrypoint python spoolmera:arm64-ci -c 'import platform; assert platform.machine() == "aarch64"'
          docker run --rm --entrypoint /bin/sh spoolmera:arm64-ci -ec '
            test -s /usr/share/doc/spoolmera/LICENSE
            test -s /usr/share/doc/spoolmera/THIRD_PARTY_LICENSES.md
            test -s /usr/share/doc/spoolmera/npm-licenses.txt
            test -s /usr/share/doc/spoolmera/python-licenses.txt
          '
      - name: Exercise ARM64 API, Angular assets, ledger and restart persistence
        shell: bash
        run: |
          set -euo pipefail
          export SPOOLMERA_BOOTSTRAP_TOKEN="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          container=""
          docker volume create spoolmera-arm64-ci >/dev/null
          cleanup() {
            if [ -n "$container" ]; then
              docker logs --tail 100 "$container" || true
              docker rm -f "$container" >/dev/null 2>&1 || true
            fi
            docker volume rm spoolmera-arm64-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          container="$(docker run --detach --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid --env SPOOLMERA_BOOTSTRAP_TOKEN --mount type=volume,source=spoolmera-arm64-ci,target=/data --publish 127.0.0.1:8765:8765 spoolmera:arm64-ci)"
          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8765/api/ready | grep -q '"status":"ready"'; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          python3 scripts/http_smoke.py
          docker restart "$container" >/dev/null
          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8765/api/ready | grep -q '"status":"ready"'; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          python3 scripts/http_smoke.py --persistence
      - name: Validate native ARM64 offline restore and runtime file ownership
        run: python3 scripts/container_restore_smoke.py --image spoolmera:arm64-ci
