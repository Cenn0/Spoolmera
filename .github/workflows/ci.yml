name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile backend
        run: python -m compileall -q app
      - name: Check frontend syntax
        run: node --check app/static/app.js
      - name: Run API tests
        run: python -m pytest -q

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build image
        run: docker build --tag filament-manager:ci .
      - name: Start container and probe HTTP
        shell: bash
        run: |
          set -euo pipefail
          docker volume create filament-manager-ci >/dev/null
          container="$(docker run --detach --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid --mount type=volume,source=filament-manager-ci,target=/data --publish 127.0.0.1:8765:8765 filament-manager:ci)"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true; docker volume rm filament-manager-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/api/health | grep -q '"status":"ok"'; then
              curl --fail --silent --output /dev/null http://127.0.0.1:8765/
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$container")" != "true" ]; then
              docker logs "$container"
              exit 1
            fi
            sleep 1
          done
          docker logs "$container"
          exit 1
