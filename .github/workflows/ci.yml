name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Compile backend
        run: python -m compileall -q app
      - name: Validate documentation links and UI screenshot files
        run: python scripts/check_docs.py
      - name: Validate generated Angular API contracts
        run: python scripts/generate_api_types.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Angular frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run i18n:check
          npm test
          npm run build
      - name: Stage compiled frontend for backend tests
        run: mkdir -p app/ui && cp -a frontend/dist/spoolmera/browser/. app/ui/
      - name: Run API tests
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-results
          path: test-results.xml
          retention-days: 7

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build image
        run: docker build --tag spoolmera:ci --tag spoolmera:test .
      - name: Start container and probe HTTP
        shell: bash
        run: |
          set -euo pipefail
          export SPOOLMERA_BOOTSTRAP_TOKEN="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          docker volume create spoolmera-ci >/dev/null
          container="$(docker run --detach --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid --env SPOOLMERA_BOOTSTRAP_TOKEN --mount type=volume,source=spoolmera-ci,target=/data --publish 127.0.0.1:8765:8765 spoolmera:ci)"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true; docker volume rm spoolmera-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/api/health | grep -q '"status":"ok"'; then
              python3 scripts/http_smoke.py
              docker restart "$container" >/dev/null
              for restart_attempt in $(seq 1 30); do
                if curl --fail --silent http://127.0.0.1:8765/api/health >/dev/null; then
                  python3 scripts/http_smoke.py --persistence
                  exit 0
                fi
                sleep 1
              done
              docker logs "$container"
              exit 1
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$container")" != "true" ]; then
              docker logs "$container"
              exit 1
            fi
            sleep 1
          done
          docker logs "$container"
          exit 1
      - name: Validate isolated test launcher
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker compose -p spoolmera-test -f compose.test.yaml down -v >/dev/null 2>&1 || true' EXIT
          python3 scripts/start_test.py --prebuilt
          export SPOOLMERA_BOOTSTRAP_TOKEN="$(python3 -c 'from pathlib import Path; print(Path(".env.test").read_text().strip().split("=", 1)[1])')"
          python3 scripts/http_smoke.py --base http://127.0.0.1:8766
      - name: Verify offline restore and runtime file ownership
        run: python3 scripts/container_restore_smoke.py --image spoolmera:ci
      - name: Build and verify optional notifier isolation
        run: |
          docker build -f Dockerfile.notifications --tag spoolmera:notifier-ci .
          python3 scripts/notifier_container_smoke.py --image spoolmera:notifier-ci --api-image spoolmera:ci
      - name: Package tested image
        run: |
          mkdir -p test-release/scripts
          docker save spoolmera:test | gzip > test-release/spoolmera-image.tar.gz
          cp compose.test.yaml test-release/
          cp scripts/start_test.py test-release/scripts/
          cp docs/testing.md test-release/TESTING.md
          cp docs/build-inputs.json test-release/
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          from app import __version__
          from app.infrastructure.database.migrations import CURRENT_SCHEMA_VERSION
          root = Path('test-release')
          image_id = subprocess.check_output(['docker', 'image', 'inspect', '--format', '{{.Id}}', 'spoolmera:test'], text=True).strip()
          (root / 'release.json').write_text(json.dumps({
              'version': __version__, 'schema_version': CURRENT_SCHEMA_VERSION,
              'commit': os.environ['GITHUB_SHA'], 'platform': 'linux/amd64',
              'image_tag': 'spoolmera:test', 'image_id': image_id,
              'image_archive': 'spoolmera-image.tar.gz',
              'status': 'tested CI artifact; no public release published',
          }, indent=2) + '\n')
          lines = []
          for path in sorted(root.rglob('*')):
              if path.is_file():
                  with path.open('rb') as content:
                      digest = hashlib.file_digest(content, 'sha256').hexdigest()
                  lines.append(digest + '  ' + path.relative_to(root).as_posix())
          (root / 'SHA256SUMS').write_text('\n'.join(lines) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('RELEASE_VERSION=' + __version__ + '\n')
          PY
      - name: Publish downloadable test instance
        uses: actions/upload-artifact@v7
        with:
          name: spoolmera-${{ env.RELEASE_VERSION }}-test-linux-amd64
          path: test-release/
          compression-level: 0
          retention-days: 7

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Angular for browser tests
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - name: Stage Angular application
        run: mkdir -p app/ui && cp -a frontend/dist/spoolmera/browser/. app/ui/
      - name: Install application and browser test dependencies
        run: python -m pip install --require-hashes -r requirements-e2e.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Exercise real browser workflows
        shell: bash
        run: |
          set -euo pipefail
          export SPOOLMERA_DB_PATH="$RUNNER_TEMP/browser-inventory.sqlite3"
          export SPOOLMERA_BOOTSTRAP_TOKEN="test-only-bootstrap-token-long-enough"
          export SPOOLMERA_PRINTER_ALLOWED_IPS="192.168.50.20"
          export SPOOLMERA_CLOUD_HMAC_BROWSER="test-only-browser-relay-secret-long-enough"
          export SPOOLMERA_CLOUD_PRINTER_BROWSER="1"
          export SPOOLMERA_BROWSER_ARTIFACT_DIR="$RUNNER_TEMP/browser-results"
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8765 >"$RUNNER_TEMP/browser-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" >/dev/null 2>&1 || true; cat "$RUNNER_TEMP/browser-server.log"' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          python scripts/browser_smoke.py
      - name: Publish browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-evidence
          path: |
            ${{ runner.temp }}/browser-results/
            ${{ runner.temp }}/browser-server.log
          retention-days: 7
      - name: Publish German interface previews
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: german-interface-previews
          path: ${{ runner.temp }}/browser-results/de-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Publish light, dark and mobile UI previews
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ui-ux-previews
          path: ${{ runner.temp }}/browser-results/ui-*.png
          if-no-files-found: error
          retention-days: 7

  slicer-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPOOLMERA_SLICER_WORKER_TOKEN: test-only-ci-slicer-worker-token-long-enough
    steps:
      - uses: actions/checkout@v7
      - name: Validate optional slicer Compose overlay
        run: docker compose -f compose.yaml -f compose.slicer.yaml config --quiet
      - name: Build opt-in slicer image from distribution packages
        run: docker build --target slicer-runtime --tag spoolmera:slicer-ci .
      - name: Check installed PrusaSlicer CLI
        run: |
          docker run --rm --entrypoint /usr/bin/test spoolmera:slicer-ci -x /usr/bin/prusa-slicer
          docker run --rm --entrypoint /usr/bin/prusa-slicer spoolmera:slicer-ci --help >/dev/null
      - name: Smoke-test isolated slicer Compose networking and token
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p slicer-profiles
          cp tests/fixtures/slicer/ci.ini slicer-profiles/ci.ini
          export SPOOLMERA_BOOTSTRAP_TOKEN="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          printf 'SPOOLMERA_BOOTSTRAP_TOKEN=%s\nSPOOLMERA_SLICER_WORKER_TOKEN=%s\n' "$SPOOLMERA_BOOTSTRAP_TOKEN" "$SPOOLMERA_SLICER_WORKER_TOKEN" > .env
          trap 'docker compose -f compose.yaml -f compose.slicer.yaml down -v >/dev/null 2>&1 || true; rm -f .env; rm -rf slicer-profiles' EXIT
          docker compose -f compose.yaml -f compose.slicer.yaml up -d --build --wait
          docker compose -f compose.yaml -f compose.slicer.yaml exec -T spoolmera python -c 'import json,os,urllib.request; req=urllib.request.Request("http://slicer-worker:8767/profiles",headers={"X-Worker-Token":os.environ["SPOOLMERA_SLICER_WORKER_TOKEN"]}); assert json.load(urllib.request.urlopen(req,timeout=5))=={"profiles":["ci"]}'
          docker compose -f compose.yaml -f compose.slicer.yaml exec -T slicer-worker python -c 'import os; assert "SPOOLMERA_BOOTSTRAP_TOKEN" not in os.environ; assert not any(k.startswith("SPOOLMERA_PRINTER_TOKEN_") for k in os.environ)'
          python3 scripts/slicer_smoke.py

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Audit locked Python runtime dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Audit Angular runtime dependencies
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
