name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile backend
        run: python -m compileall -q app
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Angular frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Stage compiled frontend for backend tests
        run: mkdir -p app/ui && cp -a frontend/dist/filament-manager/browser/. app/ui/
      - name: Run API tests
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-results
          path: test-results.xml
          retention-days: 7

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build image
        run: docker build --tag filament-manager:ci --tag filament-manager:test .
      - name: Start container and probe HTTP
        shell: bash
        run: |
          set -euo pipefail
          export FILAMENT_BOOTSTRAP_TOKEN="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          docker volume create filament-manager-ci >/dev/null
          container="$(docker run --detach --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid --env FILAMENT_BOOTSTRAP_TOKEN --mount type=volume,source=filament-manager-ci,target=/data --publish 127.0.0.1:8765:8765 filament-manager:ci)"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true; docker volume rm filament-manager-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/api/health | grep -q '"status":"ok"'; then
              python3 scripts/http_smoke.py
              docker restart "$container" >/dev/null
              for restart_attempt in $(seq 1 30); do
                if curl --fail --silent http://127.0.0.1:8765/api/health >/dev/null; then
                  python3 scripts/http_smoke.py --persistence
                  exit 0
                fi
                sleep 1
              done
              docker logs "$container"
              exit 1
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$container")" != "true" ]; then
              docker logs "$container"
              exit 1
            fi
            sleep 1
          done
          docker logs "$container"
          exit 1
      - name: Validate isolated test launcher
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker compose -p filament-manager-test -f compose.test.yaml down -v >/dev/null 2>&1 || true' EXIT
          python3 scripts/start_test.py --prebuilt
          export FILAMENT_BOOTSTRAP_TOKEN="$(python3 -c 'from pathlib import Path; print(Path(".env.test").read_text().strip().split("=", 1)[1])')"
          python3 scripts/http_smoke.py --base http://127.0.0.1:8766
      - name: Package tested image
        run: |
          mkdir -p test-release/scripts
          docker save filament-manager:test | gzip > test-release/filament-manager-image.tar.gz
          cp compose.test.yaml test-release/
          cp scripts/start_test.py test-release/scripts/
          cp docs/testing.md test-release/TESTING.md
          (cd test-release && sha256sum filament-manager-image.tar.gz > SHA256SUMS)
      - name: Publish downloadable test instance
        uses: actions/upload-artifact@v7
        with:
          name: filament-manager-test-linux-amd64
          path: test-release/
          compression-level: 0
          retention-days: 7

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Angular for browser tests
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - name: Stage Angular application
        run: mkdir -p app/ui && cp -a frontend/dist/filament-manager/browser/. app/ui/
      - name: Install application and browser test dependencies
        run: python -m pip install -r requirements-e2e.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Exercise real browser workflows
        shell: bash
        run: |
          set -euo pipefail
          export FILAMENT_DB_PATH="$RUNNER_TEMP/browser-inventory.sqlite3"
          export FILAMENT_BOOTSTRAP_TOKEN="test-only-bootstrap-token-long-enough"
          export FILAMENT_PRINTER_ALLOWED_IPS="192.168.50.20"
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8765 >"$RUNNER_TEMP/browser-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" >/dev/null 2>&1 || true; cat "$RUNNER_TEMP/browser-server.log"' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          python scripts/browser_smoke.py



  slicer-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Validate optional slicer Compose overlay
        run: docker compose -f compose.yaml -f compose.slicer.yaml config --quiet
      - name: Build opt-in slicer image from distribution packages
        run: docker build --build-arg FILAMENT_INSTALL_PRUSA_SLICER=1 --tag filament-manager:slicer-ci .
      - name: Check installed PrusaSlicer CLI
        run: |
          docker run --rm --entrypoint /usr/bin/test filament-manager:slicer-ci -x /usr/bin/prusa-slicer
          docker run --rm --entrypoint /usr/bin/prusa-slicer filament-manager:slicer-ci --version
