name: Publish main container to GHCR

# The normal push-to-main CI must pass before an image can be published.
# A direct push is covered by the same CI gate as a merged pull request.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Serialize publishes so a slower build cannot replace a newer image.
concurrency:
  group: spoolmera-main-container
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'Cenn0/Spoolmera' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'Cenn0/Spoolmera'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the exact CI-tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Skip stale CI results
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]]; then
            echo "This CI run is no longer the tip of main; skipping publish."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU for ARM64
        if: steps.revision.outputs.current == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        if: steps.revision.outputs.current == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        if: steps.revision.outputs.current == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish tested main image for AMD64 and ARM64
        if: steps.revision.outputs.current == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          target: app-runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/cenn0/spoolmera:main
            ghcr.io/cenn0/spoolmera:sha-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Cenn0/Spoolmera
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.description=Experimental self-hosted 3D-printing workspace from main
          cache-from: type=gha,scope=spoolmera-main
          cache-to: type=gha,mode=max,scope=spoolmera-main
          provenance: mode=min
          sbom: true

      - name: Verify published multi-platform manifest
        if: steps.revision.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/cenn0/spoolmera:sha-${{ github.event.workflow_run.head_sha }}"
          docker buildx imagetools inspect "$image" | tee /tmp/spoolmera-image-manifest.txt
          grep -F 'linux/amd64' /tmp/spoolmera-image-manifest.txt
          grep -F 'linux/arm64' /tmp/spoolmera-image-manifest.txt
          {
            echo "### Published experimental main image"
            echo ""
            echo "Image: \`ghcr.io/cenn0/spoolmera:main\`"
            echo ""
            echo "Commit-pinned tag: \`$image\`"
            echo ""
            echo "Platforms: linux/amd64, linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"
