name: Publish main container to GHCR

# The normal push-to-main CI must pass before an image can be published.
# A direct push is covered by the same CI gate as a merged pull request.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Serialize publishes so a slower build cannot replace a newer image.
concurrency:
  group: spoolmera-main-container
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'Cenn0/Spoolmera' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'Cenn0/Spoolmera'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      current: ${{ steps.revision.outputs.current }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Check out the exact CI-tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Skip stale CI results
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]]; then
            echo "This CI run is no longer the tip of main; skipping publish."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU for ARM64
        if: steps.revision.outputs.current == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        if: steps.revision.outputs.current == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        if: steps.revision.outputs.current == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build candidate image for AMD64 and ARM64
        id: image
        if: steps.revision.outputs.current == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          target: app-runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/cenn0/spoolmera:candidate-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Cenn0/Spoolmera
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.description=Experimental self-hosted 3D-printing workspace from main
          cache-from: type=gha,scope=spoolmera-main
          cache-to: type=gha,mode=max,scope=spoolmera-main
          provenance: mode=min
          sbom: true

  verify:
    name: Verify registry image (${{ matrix.architecture }})
    needs: publish
    if: needs.publish.outputs.current == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/cenn0/spoolmera@${{ needs.publish.outputs.digest }}
      SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
      ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Log in for candidate download
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull exact registry digest and verify native runtime and persistence
        run: python3 scripts/verify_published_image.py --image "$IMAGE" --commit "$SOURCE_COMMIT" --architecture "$ARCHITECTURE"
      - name: Verify offline recovery from the downloaded image
        run: python3 scripts/container_restore_smoke.py --image "$IMAGE"
      - name: Scan actual image packages and generate image SBOM
        run: python3 scripts/scan_container.py --image "$IMAGE" --output "$RUNNER_TEMP/container-scan"
      - name: Summarize container vulnerability gate
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = Path(os.environ["RUNNER_TEMP"]) / "container-scan/scan-summary.json"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("### Registry image verification\n\n")
              out.write(f"Image: `{os.environ['IMAGE']}`\n\n")
              if report.is_file():
                  data = json.loads(report.read_text())
                  out.write(f"Trivy {data['scanner_version']}: {data['findings']} findings; "
                            f"**{data['blocking_findings']} HIGH/CRITICAL**, including unfixed.\n")
              else:
                  out.write("No completed vulnerability report. Verification is not accepted.\n")
          PY

  promote:
    name: Promote verified image to main
    needs: [publish, verify]
    if: needs.publish.outputs.current == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/cenn0/spoolmera@${{ needs.publish.outputs.digest }}
      SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Recheck main and promote the verified digest without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          if [[ "$SOURCE_COMMIT" != "$(git rev-parse FETCH_HEAD)" ]]; then
            echo "Main changed during verification; retaining the current main image."
            exit 0
          fi
          [[ "$IMAGE" =~ ^ghcr.io/cenn0/spoolmera@sha256:[0-9a-f]{64}$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          docker buildx imagetools create \
            --tag "ghcr.io/cenn0/spoolmera:sha-$SOURCE_COMMIT" \
            --tag ghcr.io/cenn0/spoolmera:main "$IMAGE"
          {
            echo "### Promoted verified experimental main image"
            echo ""
            echo "Digest: \`$IMAGE\`"
            echo ""
            echo "Tags: \`ghcr.io/cenn0/spoolmera:main\`, \`ghcr.io/cenn0/spoolmera:sha-$SOURCE_COMMIT\`"
            echo ""
            echo "Native AMD64/ARM64 registry runtime, recovery and image vulnerability gates passed."
          } >> "$GITHUB_STEP_SUMMARY"
