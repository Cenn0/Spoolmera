name: Nightly dependency audit

on:
  schedule:
    # 03:00 Europe/Berlin: 01:00 UTC in summer, 02:00 UTC in winter.
    - cron: '0 1,2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 1,2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check Berlin local time
        id: berlin
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ] || [ "$(TZ=Europe/Berlin date +%H)" = 03 ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.berlin.outputs.run == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: steps.berlin.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Audit Python dependencies
        if: steps.berlin.outputs.run == 'true'
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          python -m pip_audit -r requirements.txt --disable-pip --no-deps
          python -m pip_audit -r requirements-dev.txt --disable-pip --no-deps
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.berlin.outputs.run == 'true'
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Audit Angular dependencies
        if: steps.berlin.outputs.run == 'true'
        working-directory: frontend
        run: npm audit --package-lock-only --audit-level=high
