name: Nightly dependency audit

on:
  schedule:
    # GitHub schedules in this IANA timezone, including daylight-saving changes.
    - cron: '0 3 * * *'
      timezone: 'Europe/Berlin'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          python -m pip_audit -r requirements.txt --disable-pip --no-deps
          python -m pip_audit -r requirements-dev.txt --disable-pip --no-deps
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Audit Angular dependencies
        working-directory: frontend
        run: npm audit --package-lock-only --audit-level=high
