# Optional overlay; start with:
# docker compose -f compose.yaml -f compose.slicer.yaml up -d --build
# Requires FILAMENT_SLICER_ENABLED=1 in the .env file and explicit operator-
# supplied, version-compatible INI profiles. Read-only mount; never permit
# end users to edit these profiles.
services:
  filament-manager:
    build:
      args:
        FILAMENT_INSTALL_PRUSA_SLICER: "1"
    volumes:
      - ./slicer-profiles:/config/slicer-profiles:ro
    mem_limit: 2g
    pids_limit: 128
    cpus: 2.0
